edition = "2024";

package com.google.android.as.oss.featurelauncher.api;


option features.default_symbol_visibility = STRICT;
option java_outer_classname = "FeatureLauncher";
option features.field_presence = IMPLICIT;
option java_package = "com.google.android.as.oss.featurelauncher.api.proto";

// Service for executing authorized features on behalf of clients
service PcsFeatureLauncherService {
  // Executes an authorized feature on behalf of a client.
  rpc ExecuteFeature(ExecuteFeatureRequest) returns (ExecuteFeatureResponse) {
    option deadline = 5.0;
  }
}

// Request message for executing features.
message ExecuteFeatureRequest {
  // The features to execute.
  repeated Feature feature = 1;
}

// Response message for executing feature requests.
message ExecuteFeatureResponse {
  // The results of the feature operations.
  repeated FeatureResult feature_result = 1
     ;
}

message Feature {
  FeatureType feature_type = 1;

  oneof params {
    RelationshipsParams relationships_params = 2
       ;

    AddToListParams add_to_list_params = 3
       ;
    SaveToKeepNoteParams save_to_keep_note_params = 4
       ;
  }
}

// Supported proxy features
enum FeatureType {
  FEATURE_TYPE_UNSPECIFIED = 0;
  FEATURE_TYPE_RELATIONSHIPS_ONBOARDING_CONSENT = 1;
  FEATURE_TYPE_RELATIONSHIPS_SETTINGS = 2;
  FEATURE_TYPE_RELATIONSHIPS_REMOVE_VIP_CONFIRMATION = 3;
  FEATURE_TYPE_ADD_TO_KEEP_LIST = 4;
  FEATURE_TYPE_SAVE_TO_KEEP_NOTE = 5;
}

message RelationshipsParams {
  int64 contact_id = 1;
}

message AddToListParams {
  string list_name = 1;

  repeated string items = 2;
  int64 reminder_time_millis = 3;
}

message SaveToKeepNoteParams {
  string title = 1;
  string text = 2;
  int64 reminder_time_millis = 3;
}

// Represents the result of a single feature operation.
message FeatureResult {
  // The feature that was executed.
  Feature feature = 1;

  // The status of the feature operation.
  enum Status {
    UNKNOWN = 0;
    SUCCESS = 1;
    FAILURE = 2;
  }

  Status status = 2;

  // The result code from the activity.
  int32 result_code = 3;

  // The parceled result.
  bytes parceled_result = 4;
}
