edition = "2023";

package mdi.privatearatea;

option java_multiple_files = true;
option java_outer_classname = "PrivateTlsServiceOuterClass";
option java_package = "com.google.search.mdi.privatearatea.proto";

// Service for establishing TLS sessions.
service PrivateTlsService {
  // Establishes a TLS session.
  rpc TlsSession(stream TlsSessionRequest) returns (stream TlsSessionResponse);
}

// Request message for the TLS session.
message TlsSessionRequest {
  bytes frame = 1;
}

// Response message for the TLS session.
message TlsSessionResponse {
  bytes frame = 1;
}
